apply plugin: 'com.android.application'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.calendardesk"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    signingConfigs {
        // 个人分发：用调试签名（可安装）；上架应用市场请替换为自己的 release keystore
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        // 本应用面向旧设备（minSdk 23），暂不提升 targetSdk；仅 GitHub 分发，不上架 Google Play
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // AndroidX core (API 23 compatible)
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.fragment:fragment:1.2.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // Lunar calendar (纯Java，同一作者6tail的lunar-javascript的Java版)
    implementation 'cn.6tail:lunar:1.7.4'

    // OkHttp 3.x — last major supporting API 21+ (4.x requires API 24+)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // JSON
    implementation 'com.google.code.gson:gson:2.8.9'

    // Java 8 time backport (java.time needs API 26+)
    implementation 'com.jakewharton.threetenabp:threetenabp:1.3.1'
}
